# Production overrides for btc-main-service
replicaCount: 1

image:
  repository: ghcr.io/bottomhalf/btc-main-service
  pullPolicy: Always

resources:
  limits:
    cpu: 1000m
    memory: 768Mi
  requests:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 75
