# Default values for Confeet Helm Chart
global:
  environment: production

namespace:
  create: false
  name: cf

replicaCount: 1

image:
  repository: ghcr.io/bottomhalf/btc-main-service
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: "btc-main-service"

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels:
  app.kubernetes.io/component: backend
  app.kubernetes.io/part-of: confeet

podSecurityContext: {}

securityContext: {}

service:
  name: btc-main-service
  type: LoadBalancer
  port: 7801
  targetPort: 7801
  protocol: TCP
  nodePort: null

resources:
  limits:
    cpu: 1000m
    memory: 768Mi
  requests:
    cpu: 200m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /api/main/health/healthCheck
    port: 8553
  initialDelaySeconds: 40
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/main/health/healthCheck
    port: 8553
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - btc-main-service
          topologyKey: kubernetes.io/hostname

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
