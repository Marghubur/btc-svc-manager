apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name | default (include "btc-main-service.fullname" .) }}
  namespace: {{ .Values.namespace.name | default .Release.Namespace }}
  labels:
    {{- include "btc-main-service.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: {{ .Values.service.protocol | default "TCP" }}
      {{- if .Values.service.portName }}
      name: {{ .Values.service.portName }}
      {{- end }}
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    {{- if .Values.service.selector }}
    {{- toYaml .Values.service.selector | nindent 4 }}
    {{- else }}
    {{- include "btc-main-service.selectorLabels" . | nindent 4 }}
    {{- end }}

